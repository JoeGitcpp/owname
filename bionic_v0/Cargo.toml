[package]
name = "bionic_v0"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
name = "body"
path = "src/bin/body.rs"

[[bin]]
name = "observer"
path = "src/bin/observer.rs"

[[bin]]
name = "observer_surface"
path = "src/bin/observer_surface.rs"

[dependencies]
cpal = "0.15"
nokhwa = { version = "0.10", features = ["input-avfoundation"] }
pixels = "0.13"
winit = "0.28"

[profile.release]
opt-level = 3
lto = "thin"
