[package]
name = "bionic_v0"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
name = "body"
path = "src/bin/body.rs"

[[bin]]
name = "observer"
path = "src/bin/observer.rs"

[[bin]]
name = "observer_surface"
path = "src/bin/observer_surface.rs"

[[bin]]
name = "curriculum_report"
path = "src/bin/curriculum_report.rs"

[[bin]]
name = "live_training_runner"
path = "src/bin/live_training_runner.rs"

[[bin]]
name = "byte_loopback"
path = "src/bin/byte_loopback.rs"

[[bin]]
name = "training_curve"
path = "src/bin/training_curve.rs"

[[bin]]
name = "post_effect_probe"
path = "src/bin/post_effect_probe.rs"

[[bin]]
name = "learned_bias_probe"
path = "src/bin/learned_bias_probe.rs"

[[bin]]
name = "sandbox_runner"
path = "src/bin/sandbox_runner.rs"

[dependencies]
cpal = "0.15"
nokhwa = { version = "0.10", features = ["input-avfoundation"] }
pixels = "0.13"
winit = "0.28"
rayon = "1.10"

[profile.release]
opt-level = 3
lto = "thin"
strip = "symbols"     # remove all symbol table + debug info from binary
codegen-units = 1     # single codegen unit: best optimization + hardest to reverse
